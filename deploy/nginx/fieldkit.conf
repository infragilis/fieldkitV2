server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow large firmware/config uploads (nginx default is 1 MiB).
    client_max_body_size 2g;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Self-signed HTTPS (decision 12). HTTP on 80 is retained with no redirect so
# plain-HTTP clients (for example the /fieldkit export) are unaffected. The
# certificate is generated per device on first boot by fieldkit-tls-cert.service.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/fieldkit.crt;
    ssl_certificate_key /etc/nginx/ssl/fieldkit.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2g;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
