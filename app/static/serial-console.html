<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fieldkit Console __CONSOLE_NUMBER__</title>
    <link rel="stylesheet" href="/static/vendor/xterm.css" />
    <style>
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        color: #e7eef9;
        background:
          radial-gradient(circle at top left, rgba(245, 158, 11, 0.14), transparent 26%),
          linear-gradient(180deg, #070d1a, #0b1220);
      }
      main {
        position: fixed;
        inset: 0;
        width: min(100vw, 1100px);
        height: 100%;
        margin: 0 auto;
        padding: 18px;
        overflow: hidden;
      }
      article {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: rgba(13, 21, 38, 0.96);
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 16px;
        padding: 18px;
        overflow: hidden;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
      }
      .header { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
      .header-actions { display: flex; align-items: center; gap: 12px; }
      .header h1 { margin: 0; font-size: 1.25rem; font-family: "Space Grotesk", "Inter", sans-serif; }
      .muted { color: #93a6c3; }
      .console-output {
        flex: 1 1 auto;
        min-height: 0;
        margin: 0;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.16);
        background: #050b14;
        outline: none;
        overflow: hidden;
        overscroll-behavior: contain;
      }
      .console-output .xterm {
        height: 100%;
        padding: 12px;
      }
      button {
        padding: 8px 16px;
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 10px;
        background: #101b31;
        color: #e7eef9;
        font: inherit;
        font-size: 0.88rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        border-color: rgba(245, 158, 11, 0.6);
        color: #f59e0b;
      }
      .capture-note {
        margin: 0 0 12px;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <article>
        <div class="header">
          <h1 id="console-title">Console __CONSOLE_NUMBER__</h1>
          <div class="header-actions">
            <button id="reconnect-button" type="button">Reconnect</button>
            <span id="console-status" class="muted">Opening session...</span>
          </div>
        </div>
        <p id="console-capture-note" class="muted capture-note">Keyboard input is captured directly in this window. Click the terminal area if input focus is lost.</p>
        <p id="console-identity" class="muted capture-note"></p>
        <div id="console-output" class="console-output"></div>
      </article>
    </main>
    <script src="/static/vendor/xterm.js"></script>
    <script src="/static/vendor/xterm-addon-fit.js"></script>
    <script src="/static/app.js?v=ui-0.2.2-20261003"></script>
    <script>
      const profileIndex = __PROFILE_INDEX__;
      const consoleNumber = __CONSOLE_NUMBER__;
      let consoleSocket = null;
      let suppressNextClose = false;
      const output = document.getElementById("console-output");
      const terminal = new Terminal({
        cursorBlink: true,
        fontFamily: "'JetBrains Mono', 'IBM Plex Mono', monospace",
        fontSize: 15,
        theme: {
          background: "#050b14",
          foreground: "#7ee2a8",
          cursor: "#f59e0b",
        },
      });
      const fitAddon = new FitAddon.FitAddon();
      terminal.loadAddon(fitAddon);
      terminal.open(output);
      if (terminal.element) {
        terminal.element.addEventListener("wheel", (event) => event.stopPropagation(), { passive: true });
        terminal.element.addEventListener("touchmove", (event) => event.stopPropagation(), { passive: true });
      }
      if (terminal.textarea) {
        terminal.textarea.setAttribute("autocapitalize", "off");
        terminal.textarea.setAttribute("autocomplete", "off");
        terminal.textarea.setAttribute("autocorrect", "off");
        terminal.textarea.setAttribute("spellcheck", "false");
        terminal.textarea.setAttribute("inputmode", "text");
      }

      function uiText(key, fallback, vars = {}) {
        return window.fieldkitUi ? window.fieldkitUi.t(key, vars) : fallback;
      }

      function focusTerminal() {
        terminal.focus();
        if (terminal.textarea) {
          terminal.textarea.focus();
        }
      }

      function translateConsolePage() {
        document.getElementById("console-title").textContent = uiText("console_window_title", `Console ${consoleNumber}`, { index: consoleNumber });
        document.getElementById("reconnect-button").textContent = uiText("reconnect", "Reconnect");
        document.getElementById("console-capture-note").textContent = uiText("console_capture_note", "Keyboard input is captured directly in this window. Click the terminal area if input focus is lost.");
      }

      async function loadIdentity() {
        const target = document.getElementById("console-identity");
        try {
          const response = await fetch("/api/serial/sessions");
          const payload = await response.json();
          const session = (payload.sessions || []).find((item) => item.index === profileIndex);
          if (!session) {
            target.textContent = "";
            return;
          }
          if (!session.present) {
            target.textContent = uiText("device_not_present", "No adapter detected for this console.");
            return;
          }
          const serial = session.serial ? `${session.serial} · ` : "";
          const tty = session.tty_device || session.active_device || "";
          const parity = session.parity === "none" ? "N" : String(session.parity).charAt(0).toUpperCase();
          const framing = `${session.baud_rate} ${session.data_bits}${parity}${session.stop_bits}`;
          const mode = session.bound ? uiText("pinned", "pinned") : uiText("auto_detect", "auto-detect");
          target.textContent = `${serial}${tty} · ${framing} · ${mode}`;
        } catch (_) {
          target.textContent = "";
        }
      }

      function sendRawInput(data) {
        if (!consoleSocket || consoleSocket.readyState !== WebSocket.OPEN) {
          terminal.writeln("[no active console]");
          return;
        }
        consoleSocket.send(data);
      }

      function connectConsole() {
        if (consoleSocket && (consoleSocket.readyState === WebSocket.OPEN || consoleSocket.readyState === WebSocket.CONNECTING)) {
          suppressNextClose = true;
          consoleSocket.close();
        }
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const socketUrl = `${protocol}//${window.location.host}/api/serial/ws/${profileIndex}`;
        const status = document.getElementById("console-status");
        status.textContent = uiText("connecting", "Connecting...");
        if (terminal.buffer.active.length) {
          terminal.writeln(`[${uiText("reconnecting", "reconnecting").toLowerCase()}]`);
        } else {
          terminal.writeln(uiText("connecting_to_console", `Connecting to console ${consoleNumber}...`, { index: consoleNumber }));
        }
        consoleSocket = new WebSocket(socketUrl);
        consoleSocket.onopen = () => {
          status.textContent = uiText("connected", "Connected");
          fitAddon.fit();
          focusTerminal();
          loadIdentity();
        };
        consoleSocket.onmessage = (event) => {
          terminal.write(event.data);
        };
        consoleSocket.onclose = () => {
          if (suppressNextClose) {
            suppressNextClose = false;
            return;
          }
          status.textContent = uiText("disconnected", "Disconnected");
          terminal.writeln("");
          terminal.writeln(`[${uiText("console_disconnected", "console disconnected").toLowerCase()}]`);
        };
      }

      window.addEventListener("beforeunload", () => {
        if (consoleSocket) {
          consoleSocket.close();
        }
      });
      window.addEventListener("fieldkit:language-change", translateConsolePage);
      window.addEventListener("resize", () => {
        fitAddon.fit();
        focusTerminal();
      });
      window.addEventListener("keydown", (event) => {
        const target = event.target;
        const terminalEvent = (terminal.textarea && target === terminal.textarea) ||
          (terminal.element && target instanceof Node && terminal.element.contains(target));
        if (!terminalEvent && (event.key === "PageUp" || event.key === "PageDown" || event.key === "ArrowUp" || event.key === "ArrowDown")) {
          event.preventDefault();
        }
        focusTerminal();
      }, { capture: true });
      window.addEventListener("focus", focusTerminal);
      terminal.onData(sendRawInput);
      document.getElementById("reconnect-button").addEventListener("click", connectConsole);
      output.addEventListener("click", () => {
        focusTerminal();
      });
      output.addEventListener("touchstart", () => {
        focusTerminal();
      }, { passive: true });
      translateConsolePage();
      fitAddon.fit();
      loadIdentity();
      connectConsole();
    </script>
  </body>
</html>
