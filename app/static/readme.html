<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fieldkit README</title>
    <script>
      document.documentElement.dataset.theme = localStorage.getItem("fieldkit-theme") || "dark";
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css?v=ui-0.2.1-20260913" />
    <style>
      main { width: min(960px, calc(100vw - 32px)); margin: 0 auto; padding: 0 0 48px; }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <div data-topbar></div>
      <article class="panel">
        <div class="panel-head">
          <div>
            <span class="panel-kicker" data-i18n="nav_readme">README</span>
            <h1 class="panel-title" data-i18n="open_readme">Open README</h1>
          </div>
        </div>
        <pre id="readme-body">Loading...</pre>
      </article>
    </main>
    <script src="/static/app.js?v=ui-0.2.1-20260913" defer></script>
    <script>
      async function loadReadmeContent(language) {
        const response = await fetch(`/api/readme-content?lang=${encodeURIComponent(language)}`);
        if (!response.ok) {
          return;
        }
        const payload = await response.json();
        document.getElementById("readme-body").textContent = payload.content;
      }

      window.addEventListener("fieldkit:language-change", (event) => loadReadmeContent(event.detail.language));
      window.addEventListener("DOMContentLoaded", () => {
        const language = window.fieldkitUi ? window.localStorage.getItem("fieldkit-language") || "en" : "en";
        loadReadmeContent(language);
      });
    </script>
  </body>
</html>
