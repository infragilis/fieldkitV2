<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fieldkit Files</title>
    <script>
      document.documentElement.dataset.theme = localStorage.getItem("fieldkit-theme") || "light";
    </script>
    <link rel="stylesheet" href="/static/fonts.css?v=ui-0.2.4-20261005" />
<link rel="stylesheet" href="/static/styles.css?v=ui-0.2.4-20261005" />
    <style>
      main { width: min(960px, calc(100vw - 32px)); margin: 0 auto; padding: 0 0 48px; }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <div data-topbar data-exports-href="/fieldkit"></div>
      <article class="panel">
        <div class="panel-head">
          <div>
            <span class="panel-kicker" data-i18n="nav_files">Files</span>
            <h1 class="panel-title" data-i18n="files_title">Files</h1>
          </div>
        </div>
        <p class="muted" data-i18n="files_note">Browse the local file libraries available on the kit.</p>
        <div class="tabs">
          <button class="active" data-library="data">data</button>
          <button data-library="personal">personal</button>
          <button data-library="usb">usb</button>
          <button data-library="serial-logs">serial-logs</button>
        </div>
        <form id="library-upload-form" class="upload-row">
          <label>
            <span data-i18n="upload_from_desktop">Upload From Local Desktop</span>
            <input type="file" name="file" required />
          </label>
          <button type="submit" class="btn btn-primary" data-i18n="upload_current_library">Upload To Current Library</button>
        </form>
        <p id="upload-result" class="muted"></p>
        <p class="muted mono" id="library-path"></p>
        <p><button id="library-up" type="button" class="btn btn-ghost btn-small" hidden>Up one level</button></p>
        <p id="library-error" role="status"></p>
        <p id="usb-copy-status" class="muted mono" role="status"></p>
        <ul id="library-items" class="library-list"></ul>
      </article>
    </main>
    <script src="/static/app.js?v=ui-0.2.4-20261005"></script>
    <script>
      let currentLibrary = "data";
      let currentPath = "";
      let libraryRequest = 0;

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[char]));
      }

      async function deleteEntry(library, path) {
        const confirmed = window.confirm(window.fieldkitUi ? window.fieldkitUi.t("delete_confirm", { path, library }) : `Delete ${path} from ${library}?`);
        if (!confirmed) return;
        const response = await fetch(`/api/files?library=${encodeURIComponent(library)}&path=${encodeURIComponent(path)}`, {
          method: "DELETE"
        });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          window.alert(payload.detail || (window.fieldkitUi ? window.fieldkitUi.t("delete_failed") : "Delete failed"));
          return;
        }
        await loadLibrary(library, currentPath);
      }

      function updateUploadState(library) {
        const form = document.getElementById("library-upload-form");
        const button = form.querySelector("button");
        const allowed = library === "personal" || library === "usb";
        form.style.display = allowed ? "flex" : "none";
        button.textContent = window.fieldkitUi ? window.fieldkitUi.t("upload_current_library") : `Upload To ${library}`;
        document.getElementById("upload-result").textContent = allowed
          ? (currentPath ? `Uploads are saved in /${library}/.` : "")
          : (window.fieldkitUi ? (library === "data" ? window.fieldkitUi.t("uploads_managed_by_server") : window.fieldkitUi.t("uploads_not_allowed", { library })) : `Uploads are not allowed to ${library}.`);
      }

      async function uploadToCurrentLibrary(event) {
        event.preventDefault();
        const form = event.currentTarget;
        const data = new FormData(form);
        const response = await fetch(`/api/files/upload?library=${encodeURIComponent(currentLibrary)}`, {
          method: "POST",
          body: data
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          document.getElementById("upload-result").textContent = payload.detail || (window.fieldkitUi ? window.fieldkitUi.t("upload_failed") : "Upload failed");
          return;
        }
        document.getElementById("upload-result").textContent = window.fieldkitUi ? window.fieldkitUi.t("saved_to", { name: payload.saved, library: payload.library }) : `Saved ${payload.saved} to ${payload.library}`;
        form.reset();
        await loadLibrary(currentLibrary, currentPath);
      }

      let copyPoll = null;

      function t(key, vars) {
        return window.fieldkitUi ? window.fieldkitUi.t(key, vars) : key;
      }

      async function copyToUsb(library, path) {
        const status = document.getElementById("usb-copy-status");
        clearTimeout(copyPoll);
        status.textContent = t("copying_to_usb", { name: path.split("/").pop() || path });
        let response;
        try {
          response = await fetch(`/api/files/copy-to-usb?library=${encodeURIComponent(library)}&path=${encodeURIComponent(path)}`, { method: "POST" });
        } catch (error) {
          status.textContent = `${t("copy_failed")}: ${error.message}`;
          return;
        }
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          status.textContent = response.status === 409 ? t("usb_copy_running") : `${t("copy_failed")}: ${payload.detail || ""}`;
          return;
        }
        pollCopyStatus();
      }

      async function pollCopyStatus() {
        const status = document.getElementById("usb-copy-status");
        let state;
        try {
          state = await (await fetch("/api/files/copy-to-usb/status")).json();
        } catch (error) {
          copyPoll = setTimeout(pollCopyStatus, 1500);
          return;
        }
        if (state.current) {
          const current = state.current;
          const percent = current.total_bytes ? Math.floor((current.copied_bytes / current.total_bytes) * 100) : null;
          status.textContent = t("copying_to_usb", { name: current.current_file || current.path }) + (percent === null ? "" : ` ${percent}%`);
          copyPoll = setTimeout(pollCopyStatus, 1000);
          return;
        }
        const last = state.last;
        if (last) {
          status.textContent = last.outcome === "success"
            ? t("copied_to_usb", { name: last.path, destination: last.destination || "" })
            : `${t("copy_failed")}: ${last.error || ""}`;
        }
      }

      async function refreshUsbState() {
        try {
          const payload = await (await fetch("/api/files/libraries")).json();
          const usb = (payload.libraries || []).find((entry) => entry.name === "usb");
          if (!usb || !usb.mounted) {
            document.getElementById("usb-copy-status").textContent = t("usb_not_mounted");
          }
        } catch (error) {
          /* the copy attempt will surface any real error */
        }
      }

      async function loadLibrary(name, path = "") {
        const requestId = ++libraryRequest;
        document.getElementById("library-error").textContent = "";
        let payload;
        try {
          const response = await fetch(`/api/files?library=${encodeURIComponent(name)}&path=${encodeURIComponent(path)}`);
          payload = await response.json();
          if (!response.ok) throw new Error(payload.detail || "Could not open folder.");
        } catch (error) {
          if (requestId === libraryRequest) document.getElementById("library-error").textContent = error.message;
          return;
        }
        if (requestId !== libraryRequest) return;
        currentLibrary = name;
        currentPath = payload.path === "." ? "" : payload.path;
        document.querySelectorAll("[data-library]").forEach((b) => b.classList.toggle("active", b.dataset.library === name));
        updateUploadState(name);
        document.getElementById("library-up").hidden = !currentPath;
        window.history.replaceState(null, "", `/files?library=${encodeURIComponent(name)}&path=${encodeURIComponent(currentPath)}`);
        document.getElementById("library-path").textContent = `/${payload.library}/${currentPath}`;
        const i18n = window.fieldkitUi;
        const copyable = name === "data" || name === "personal";
        document.getElementById("library-items").innerHTML =
          payload.items.map((item) =>
            `<li>
              <div class="item-meta">
                ${item.is_dir
                  ? `<a href="/files?library=${encodeURIComponent(name)}&path=${encodeURIComponent(item.path)}" data-directory-path="${escapeHtml(item.path)}">${escapeHtml(item.name)}/</a>`
                  : `<a href="/api/files/download?library=${encodeURIComponent(payload.library)}&path=${encodeURIComponent(item.path)}" download>${escapeHtml(item.name)}</a>`
                }
                ${item.is_dir ? "" : `<span class="muted">${i18n ? i18n.t("bytes", { size: item.size }) : `${item.size} bytes`}</span>`}
                ${item.on_usb ? `<span class="usb-ok" title="${i18n ? i18n.t("on_usb") : "On USB"}">✓ ${i18n ? i18n.t("on_usb") : "On USB"}</span>` : ""}
              </div>
              <div class="item-actions">
                ${item.is_dir ? "" : `<a class="btn btn-ghost btn-small" href="/api/files/download?library=${encodeURIComponent(payload.library)}&path=${encodeURIComponent(item.path)}" download>${i18n ? i18n.t("download") : "Download"}</a>`}
                ${copyable ? `<button class="btn btn-ghost btn-small" type="button" data-copy-path="${escapeHtml(item.path)}">${i18n ? i18n.t("copy_to_usb") : "Copy to USB"}</button>` : ""}
                ${item.deletable ? `<button class="btn btn-small delete-button" type="button" data-delete-path="${escapeHtml(item.path)}">${i18n ? i18n.t("delete") : "Delete"}</button>` : ""}
              </div>
            </li>`
          ).join("") || `<li>${i18n ? i18n.t("no_entries") : "No entries"}</li>`;
        document.querySelectorAll("[data-delete-path]").forEach((button) => {
          button.addEventListener("click", () => deleteEntry(currentLibrary, button.dataset.deletePath));
        });
        document.querySelectorAll("[data-copy-path]").forEach((button) => {
          button.addEventListener("click", () => copyToUsb(currentLibrary, button.dataset.copyPath));
        });
        document.querySelectorAll("[data-directory-path]").forEach((link) => {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            loadLibrary(currentLibrary, link.dataset.directoryPath);
          });
        });
      }
      document.querySelectorAll("[data-library]").forEach((button) => {
        button.addEventListener("click", () => loadLibrary(button.dataset.library));
      });
      document.getElementById("library-upload-form").addEventListener("submit", uploadToCurrentLibrary);
      document.getElementById("library-up").addEventListener("click", () => loadLibrary(currentLibrary, currentPath.split("/").slice(0, -1).join("/")));
      const initialFolder = new URLSearchParams(window.location.search);
      loadLibrary(initialFolder.get("library") || "data", initialFolder.get("path") || "");
      refreshUsbState();
    </script>
  </body>
</html>
