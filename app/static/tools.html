<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fieldkit Tools</title>
    <link rel="stylesheet" href="/static/styles.css?v=tools-20260709" />
  </head>
  <body>
    <main class="app-shell">
      <div data-topbar></div>

      <section class="hero">
        <div class="hero-card hero-card-main tools-hero">
          <p class="hero-kicker" data-i18n="nav_tools">Tools</p>
          <h1 data-i18n="subnet_calculator">Subnet Calculator</h1>
          <p class="subhead" data-i18n="subnet_note">Calculate IPv4 network details for field addressing and handoff notes.</p>
        </div>
        <div class="hero-card hero-card-side">
          <p class="hero-kicker" data-i18n="quick_access">Quick Access</p>
          <div class="hero-shortcuts">
            <a href="/" data-i18n="back_to_console">Back to Console</a>
            <a href="/settings" data-i18n="open_settings">Open Settings</a>
            <a href="/files" data-i18n="browse_files">Browse Files</a>
          </div>
        </div>
      </section>

      <section class="grid tools-grid">
        <article class="panel subnet-panel" id="subnet">
          <h2 data-i18n="subnet_calculator">Subnet Calculator</h2>
          <form id="subnet-form" class="subnet-form">
            <label>
              <span data-i18n="ip_address">IP Address</span>
              <input id="subnet-ip" name="ip_address" type="text" inputmode="decimal" autocomplete="off" value="192.168.200.120" placeholder="192.168.200.120 or 192.168.200.120/24" />
            </label>
            <label>
              <span data-i18n="cidr_prefix">CIDR Prefix</span>
              <input id="subnet-prefix" name="cidr_prefix" type="number" min="0" max="32" value="24" />
            </label>
            <button type="submit" data-i18n="calculate">Calculate</button>
          </form>
          <p id="subnet-error" class="muted subnet-error" role="status"></p>
          <dl id="subnet-results" class="subnet-results"></dl>
        </article>
      </section>

      <footer class="app-footer">
        <span id="footer-power-status" class="footer-status-badge footer-status-unknown">Input voltage unavailable</span>
        <span>Fieldkit by <a href="https://www.infragilis.org" target="_blank" rel="noopener noreferrer">Infragilis</a>, 2026, git repo is <a href="https://github.com/infragilis/fieldkitV2" target="_blank" rel="noopener noreferrer">here</a>.</span>
      </footer>
    </main>

    <script src="/static/app.js?v=tools-i18n-20260709" defer></script>
  </body>
</html>
