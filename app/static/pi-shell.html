<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fieldkit Local Shell</title>
    <script>
      document.documentElement.dataset.theme = localStorage.getItem("fieldkit-theme") || "dark";
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css?v=ui-0.1.7-20260912-sec" />
    <link rel="stylesheet" href="/static/vendor/xterm.css" />
    <style>
      main { width: min(1100px, calc(100vw - 32px)); margin: 0 auto; padding: 0 0 48px; }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <div data-topbar></div>
      <article class="panel">
        <div class="panel-head">
          <div>
            <span class="panel-kicker" data-i18n="open_local_shell">Open Local Shell</span>
            <h1 class="panel-title" data-i18n="local_shell_title">Local Pi Shell</h1>
          </div>
        </div>
        <p class="muted shell-note" data-i18n="local_shell_note">This terminal runs directly on the Fieldkit appliance as the local service account.</p>
        <div class="shell-toolbar">
          <button id="shell-reconnect-button" type="button" class="btn btn-ghost btn-small" data-i18n="reconnect">Reconnect</button>
          <span id="shell-status" class="muted" data-i18n="opening_session">Opening session...</span>
        </div>
        <div id="shell-output" class="shell-output"></div>
      </article>
    </main>
    <script src="/static/vendor/xterm.js"></script>
    <script src="/static/vendor/xterm-addon-fit.js"></script>
    <script src="/static/app.js?v=ui-0.1.7-20260912-sec"></script>
    <script>
      let shellSocket = null;
      let suppressNextClose = false;
      const output = document.getElementById("shell-output");
      const terminal = new Terminal({
        cursorBlink: true,
        fontFamily: "'JetBrains Mono', 'IBM Plex Mono', monospace",
        fontSize: 15,
        theme: {
          background: "#050b14",
          foreground: "#7ee2a8",
          cursor: "#f59e0b",
        },
      });
      const fitAddon = new FitAddon.FitAddon();
      terminal.loadAddon(fitAddon);
      terminal.open(output);
      if (terminal.textarea) {
        terminal.textarea.setAttribute("autocapitalize", "off");
        terminal.textarea.setAttribute("autocomplete", "off");
        terminal.textarea.setAttribute("autocorrect", "off");
        terminal.textarea.setAttribute("spellcheck", "false");
        terminal.textarea.setAttribute("inputmode", "text");
      }

      function sendShellMessage(payload) {
        if (!shellSocket || shellSocket.readyState !== WebSocket.OPEN) {
          return;
        }
        shellSocket.send(JSON.stringify(payload));
      }

      function resizeShell() {
        fitAddon.fit();
        sendShellMessage({ type: "resize", cols: terminal.cols, rows: terminal.rows });
      }

      function connectShell() {
        if (shellSocket && (shellSocket.readyState === WebSocket.OPEN || shellSocket.readyState === WebSocket.CONNECTING)) {
          suppressNextClose = true;
          shellSocket.close();
        }
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        shellSocket = new WebSocket(`${protocol}//${window.location.host}/api/shell/ws`);
        const status = document.getElementById("shell-status");
        status.textContent = window.fieldkitUi ? window.fieldkitUi.t("connecting") : "Connecting...";
        if (terminal.buffer.active.length) {
          terminal.writeln(`[${window.fieldkitUi ? window.fieldkitUi.t("reconnecting").toLowerCase() : "reconnecting"}]`);
        }
        shellSocket.onopen = () => {
          status.textContent = window.fieldkitUi ? window.fieldkitUi.t("connected") : "Connected";
          resizeShell();
          terminal.focus();
          if (terminal.textarea) {
            terminal.textarea.focus();
          }
        };
        shellSocket.onmessage = (event) => {
          terminal.write(event.data);
        };
        shellSocket.onerror = () => {
          status.textContent = window.fieldkitUi ? window.fieldkitUi.t("disconnected") : "Disconnected";
        };
        shellSocket.onclose = () => {
          if (suppressNextClose) {
            suppressNextClose = false;
            return;
          }
          status.textContent = window.fieldkitUi ? window.fieldkitUi.t("disconnected") : "Disconnected";
          terminal.writeln("");
          terminal.writeln(`[${window.fieldkitUi ? window.fieldkitUi.t("console_disconnected").toLowerCase() : "disconnected"}]`);
        };
      }

      window.addEventListener("beforeunload", () => {
        if (shellSocket) {
          shellSocket.close();
        }
      });
      terminal.onData((data) => sendShellMessage({ type: "input", data }));
      window.addEventListener("resize", resizeShell);
      document.getElementById("shell-reconnect-button").addEventListener("click", () => {
        connectShell();
      });
      output.addEventListener("click", () => {
        terminal.focus();
        if (terminal.textarea) {
          terminal.textarea.focus();
        }
      });
      output.addEventListener("touchstart", () => {
        terminal.focus();
        if (terminal.textarea) {
          terminal.textarea.focus();
        }
      }, { passive: true });
      connectShell();
    </script>
  </body>
</html>
